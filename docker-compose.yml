services:
  # 1. Agent: Base de Données PostGreSQL (Stockage des données brutes et des prédictions)
  db:
    image: postgres:15-alpine
    container_name: eu_brp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-eubrp_db}
    # Initialisation du schéma de la BDD lors du premier démarrage
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db_init/db_schema.sql:/docker-entrypoint-initdb.d/db_schema.sql
    # Bind to loopback only so the database is reachable from the host (psql,
    # debugging) without being exposed on every interface. Other services in
    # the compose network reach it via the internal "db" hostname regardless.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. Agent: Data_Harvester (Récolte et nettoyage des données Eurostat)
  data_harvester:
    build:
      context: ./data_harvester
      dockerfile: Dockerfile
    container_name: eu_brp_harvester
    # Conteneur résident AU REPOS (`sleep infinity`, quasi zéro RAM) : la récolte
    # est lancée dedans par le service `scheduler` via `docker exec`, puis le
    # process Python sort et rend sa mémoire.
    # Ne PAS revenir à un conteneur one-shot `Exited` relancé par `docker start` :
    # les nettoyages Docker périodiques (docker container/image prune, activés
    # par défaut sur Dokploy) suppriment les conteneurs arrêtés ET leurs images,
    # et le déclenchement planifié échoue alors en silence ("No such container").
    restart: unless-stopped
    init: true
    # S'assure que la BDD est prête avant de démarrer le Harvester
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      DB_HOST: db
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-eubrp_db}
      DB_PORT: ${DB_PORT:-5432}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-2}
      EXIT_ON_FAILURE: ${EXIT_ON_FAILURE:-true}
      HARVESTER_HEALTH_FILE: ${HARVESTER_HEALTH_FILE:-/tmp/harvester_health}
      HARVESTER_MONTHS: ${HARVESTER_MONTHS:-60}
      HARVESTER_TIME_CHUNK: ${HARVESTER_TIME_CHUNK:-12}
    command: sleep infinity
  # 3. Agent: Risk_Predictor (Calcul du risque et entraînement du modèle IA)
  risk_predictor:
    build:
      context: ./risk_predictor
      dockerfile: Dockerfile
    container_name: eu_brp_predictor
    # Résident au repos comme le harvester (voir le commentaire plus haut).
    # L'ordre harvester -> predictor est garanti par le scheduler (docker exec
    # en série). run_job() attend en plus (boucle bornée) que des données
    # fraîches soient présentes avant d'entraîner, donc pas de course.
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      DB_HOST: db
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-eubrp_db}
      DB_PORT: ${DB_PORT:-5432}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-2}
      EXIT_ON_FAILURE: ${EXIT_ON_FAILURE:-true}
      PREDICTOR_HEALTH_FILE: ${PREDICTOR_HEALTH_FILE:-/tmp/predictor_health}
    command: sleep infinity
  # 3b. Scheduler : cron sidecar léger (~15 Mo) qui lance la récolte puis la prédiction
  # DANS les conteneurs résidents via `docker exec` -> aucune duplication de
  # config/secrets/réseau. `docker exec` attend la fin et propage le code retour,
  # donc le predictor ne tourne que si la récolte a réussi (&&). La sortie des jobs
  # est renvoyée vers le stdout du conteneur cible (/proc/1/fd/1) pour rester
  # lisible avec `docker logs eu_brp_harvester` / `eu_brp_predictor`.
  # Cadence : une passe au démarrage (premier déploiement, reboot de l'hôte), puis
  # chaque lundi. Une passe sans nouvelle publication Eurostat coûte une sonde
  # d'environ 1 Ko : le téléchargement de 440 Mo n'a lieu que si le jeu a changé.
  # NB: crond tourne en UTC dans ce conteneur (pas de tzdata) -> 02:00 UTC,
  # soit 03:00/04:00 Paris selon la saison. Créneau nocturne dans tous les cas.
  scheduler:
    image: docker:27-cli
    container_name: eu_brp_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      data_harvester:
        condition: service_started
      risk_predictor:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /usr/local/bin/refresh <<'EOF'
        #!/bin/sh
        echo "[scheduler] refresh started"
        if docker exec eu_brp_harvester sh -c 'python /app/harvester_tsv.py --once > /proc/1/fd/1 2>&1' \
          && docker exec eu_brp_predictor sh -c 'python /app/risk_predictor.py --once > /proc/1/fd/1 2>&1'; then
          echo "[scheduler] refresh OK"
        else
          echo "[scheduler] refresh FAILED (see docker logs eu_brp_harvester / eu_brp_predictor)"
          exit 1
        fi
        EOF
        chmod +x /usr/local/bin/refresh
        echo '0 2 * * 1 /usr/local/bin/refresh' > /etc/crontabs/root
        /usr/local/bin/refresh || true
        exec crond -f -l 8 -c /etc/crontabs
  # 4. Agent: API_Service (FastAPI Backend)
  api_service:
    build:
      context: ./api_service
      dockerfile: Dockerfile
    container_name: eu_brp_api
    # Service résident : doit revenir automatiquement après un reboot de l'hôte.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-eubrp_db}
      DB_PORT: ${DB_PORT:-5432}
      API_KEY: ${API_KEY:-}
    # Loopback only: the reverse proxy reaches the container over the Docker
    # network; the host port is just a local debugging convenience.
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn api_service.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: [ "CMD", "python", "-m", "api_service.healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  # 5. Tableau de bord Streamlit
  dashboard:
    build:
      context: ./api_service
      dockerfile: Dockerfile
    container_name: eu_brp_dashboard
    # Service résident : doit revenir automatiquement après un reboot de l'hôte.
    restart: unless-stopped
    depends_on:
      api_service:
        condition: service_healthy
    environment:
      API_URL: http://api_service:8000
      API_KEY: ${API_KEY:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      DASHBOARD_DEFAULT_LANG: ${DASHBOARD_DEFAULT_LANG:-en}
    # Loopback only: same rationale as api_service.
    ports:
      - "127.0.0.1:8501:8501"
    command: streamlit run api_service/dashboard.py --server.port 8501 --server.address 0.0.0.0
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import sys,requests; sys.exit(0 if requests.get('http://localhost:8501/_stcore/health', timeout=2).status_code==200 else 1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
# Volumes pour la persistance des données
volumes:
  db_data:
